name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: install / build / typecheck / test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build SDK
        run: yarn workspace @ospex/sdk build

      - name: Build CLI
        run: yarn workspace @ospex/cli build

      - name: Build rules
        run: yarn workspace @ospex/rules build

      - name: Typecheck
        run: yarn typecheck

      # Reports but cannot fail the job: typecheck:tests is advisory (CLAUDE.md).
      - name: Typecheck rules tests (advisory)
        run: yarn workspace @ospex/rules typecheck:tests
        continue-on-error: true

      - name: Test
        run: yarn test
